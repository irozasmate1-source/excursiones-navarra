<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Rosa de los vientos">
  <!-- Anillos -->
  <circle cx="60" cy="60" r="40" fill="#fbf7ee" fill-opacity="0.85" stroke="#4a3424" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="34" fill="none" stroke="#7a5534" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Puntas diagonales (NE, SE, SO, NO) -->
  <g stroke="#4a3424" stroke-width="0.6" stroke-linejoin="round">
    <polygon points="60,60 84,36 66,60" fill="#6b7f3a"/>
    <polygon points="60,60 84,36 60,54" fill="#a8b77a"/>
    <polygon points="60,60 84,84 60,66" fill="#6b7f3a"/>
    <polygon points="60,60 84,84 66,60" fill="#a8b77a"/>
    <polygon points="60,60 36,84 54,60" fill="#6b7f3a"/>
    <polygon points="60,60 36,84 60,66" fill="#a8b77a"/>
    <polygon points="60,60 36,36 60,54" fill="#6b7f3a"/>
    <polygon points="60,60 36,36 54,60" fill="#a8b77a"/>
  </g>

  <!-- Puntas principales (N, E, S, O) -->
  <g stroke="#4a3424" stroke-width="0.8" stroke-linejoin="round">
    <polygon points="60,60 60,14 52,52" fill="#d9c6a3"/>
    <polygon points="60,60 60,14 68,52" fill="#2f4a2c"/>
    <polygon points="60,60 106,60 68,52" fill="#d9c6a3"/>
    <polygon points="60,60 106,60 68,68" fill="#7a5534"/>
    <polygon points="60,60 60,106 68,68" fill="#d9c6a3"/>
    <polygon points="60,60 60,106 52,68" fill="#7a5534"/>
    <polygon points="60,60 14,60 52,68" fill="#d9c6a3"/>
    <polygon points="60,60 14,60 52,52" fill="#7a5534"/>
  </g>

  <circle cx="60" cy="60" r="3.5" fill="#4a3424"/>

  <!-- Letras -->
  <g font-family="Rockwell, 'Roboto Slab', Georgia, serif" font-weight="700" font-size="11" fill="#000" text-anchor="middle">
    <text x="60" y="10">N</text>
    <text x="60" y="118">S</text>
    <text x="113" y="64">E</text>
    <text x="7" y="64">O</text>
  </g>
</svg>
